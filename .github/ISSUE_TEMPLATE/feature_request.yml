name: Feature request
description: A new component, a missing capability, or an improvement to an existing one.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The use case, not the solution - what you are building and where Blaizio gets in the way or falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed shape
      description: If you have one - the API you would expect (parameters, composition, CLI flags). Prior art from other libraries welcome.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - New component
        - Existing component
        - Blaizio.Base (headless primitives)
        - Blaizio.Cli (the blaizio tool)
        - Theming / registry
        - Docs site
    validations:
      required: true
