name: Bug report
description: Something broken in a component, the primitives, or the CLI.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Blaizio.Base (headless primitives)
        - Blaizio.Ui (styled components)
        - Blaizio.Cli (the blaizio tool)
        - Blaizio.Icons
        - Docs site
        - Not sure
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest thing that shows the problem - a failing test, a minimal component snippet, or an exact blaizio command sequence from a fresh project.
      placeholder: |
        blaizio new showcase
        blaizio add select
        # open the page, click ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
      description: What should happen, and what happens instead. Paste exact error output if there is any.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package version (e.g. 0.1.0-alpha.16) or commit SHA, plus `blaizio --version` for CLI issues.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: OS, .NET SDK version, Blazor flavour (Server / WebAssembly / Web App), browser if relevant.
    validations:
      required: true
