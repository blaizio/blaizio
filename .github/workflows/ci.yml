name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            src/Blaizio.Base/lib/pnpm-lock.yaml
            docs/Blaizio.Docs/lib/pnpm-lock.yaml

      # Base's TS interop bundle (wwwroot/dist) - required before anything packs Blaizio.Base.
      - name: Build Blaizio.Base scripts
        working-directory: src/Blaizio.Base/lib
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The docs site's Tailwind + docs.js toolchain (its MSBuild targets shell out to these).
      - name: Install docs toolchain
        working-directory: docs/Blaizio.Docs/lib
        run: pnpm install --frozen-lockfile

      # Builds every project including the docs site, which exercises the full consumer
      # pipeline: packs Base/Icons to the local feed, builds the registry into wwwroot/r,
      # copies the styled components through the CLI, and compiles Tailwind.
      - name: Build
        run: dotnet build Blaizio.slnx

      - name: Test Blaizio.Base
        run: dotnet test tests/Blaizio.Base.Tests --no-build

      - name: Test Blaizio.Cli.Core
        run: dotnet test tests/Blaizio.Cli.Core.Tests --no-build

      - name: Test Blaizio.Cli
        run: dotnet test tests/Blaizio.Cli.Tests --no-build

      # Allocation-regression gate: per-scenario allocation ceilings (deterministic per runtime,
      # unlike wall-clock). A new per-item component, dictionary or class merge trips it.
      - name: Render benchmarks (allocation ceilings)
        env:
          BLAIZIO_BENCH_ASSERT: "1"
        run: dotnet run -c Release --project tests/Blaizio.Base.Benchmarks

  # The browser suite as a required gate: routing, keyboard, interaction and axe tests run on
  # every push/PR. The visual matrix stays out - its baselines are machine-local by design
  # (font rasterization differs across machines; see tests/Blaizio.Docs.E2E/README.md).
  docs-e2e:
    name: Docs E2E (functional + axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            src/Blaizio.Base/lib/pnpm-lock.yaml
            docs/Blaizio.Docs/lib/pnpm-lock.yaml

      - name: Build Blaizio.Base scripts
        working-directory: src/Blaizio.Base/lib
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install docs toolchain
        working-directory: docs/Blaizio.Docs/lib
        run: pnpm install --frozen-lockfile

      # Building up front keeps the fixture's `dotnet run` boot incremental and comfortably
      # inside its readiness window.
      - name: Build docs app and E2E project
        run: |
          dotnet build docs/Blaizio.Docs
          dotnet build tests/Blaizio.Docs.E2E

      # Deterministic browser provisioning; the fixture's own install call becomes a no-op.
      - name: Install Playwright Chromium
        run: pwsh tests/Blaizio.Docs.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run functional and axe tests
        env:
          BLAIZIO_E2E: "1"
        run: dotnet test tests/Blaizio.Docs.E2E --no-build --filter "FullyQualifiedName!~VisualRegression"

      # Every axe violation of every impact, pass or fail - moderate/minor findings are recorded
      # evidence even when the serious/critical gate stays green.
      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-results
          path: tests/Blaizio.Docs.E2E/AxeResults/
          if-no-files-found: ignore

  registry:
    name: Registry manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # The committed manifest must match what a fresh scan produces - a component added
      # without regenerating registry.json would otherwise ship stale.
      - name: Manifest is up to date
        run: |
          dotnet run --project src/Blaizio.Cli -- generate ./src/Blaizio.Ui --fonts
          git diff --exit-code -- src/Blaizio.Ui/registry.json

      - name: Manifest validates
        run: dotnet run --project src/Blaizio.Cli -- registry validate src/Blaizio.Ui/registry.json
