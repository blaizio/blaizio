name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            src/Blaizio.Base/lib/pnpm-lock.yaml
            docs/Blaizio.Docs/lib/pnpm-lock.yaml

      # Base's TS interop bundle (wwwroot/dist) - required before anything packs Blaizio.Base.
      - name: Build Blaizio.Base scripts
        working-directory: src/Blaizio.Base/lib
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The docs site's Tailwind + docs.js toolchain (its MSBuild targets shell out to these).
      - name: Install docs toolchain
        working-directory: docs/Blaizio.Docs/lib
        run: pnpm install --frozen-lockfile

      # Builds every project including the docs site, which exercises the full consumer
      # pipeline: packs Base/Icons to the local feed, builds the registry into wwwroot/r,
      # copies the styled components through the CLI, and compiles Tailwind.
      - name: Build
        run: dotnet build Blaizio.slnx

      - name: Test Blaizio.Base
        run: dotnet test tests/Blaizio.Base.Tests --no-build

      - name: Test Blaizio.Cli.Core
        run: dotnet test tests/Blaizio.Cli.Core.Tests --no-build

      - name: Test Blaizio.Cli
        run: dotnet test tests/Blaizio.Cli.Tests --no-build

      - name: Test Blaizio.Syntax
        run: dotnet test tests/Blaizio.Syntax.Tests --no-build

      - name: Test Blaizio.Ui
        run: dotnet test tests/Blaizio.Ui.Tests --no-build

      # Allocation-regression gate: per-scenario allocation ceilings (deterministic per runtime,
      # unlike wall-clock). A new per-item component, dictionary or class merge trips it.
      - name: Render benchmarks (allocation ceilings)
        env:
          BLAIZIO_BENCH_ASSERT: "1"
        run: dotnet run -c Release --project tests/Blaizio.Base.Benchmarks

  # The browser suite as a required gate: routing, keyboard, interaction and axe tests run on
  # every push/PR. The visual matrix stays out - its baselines are machine-local by design
  # (font rasterization differs across machines; see tests/Blaizio.Docs.E2E/README.md).
  #
  # Three jobs: docs-e2e-plan reads the shard list, docs-e2e-shard runs one job per shard in
  # parallel, and docs-e2e is the single result a branch protection rule can require.

  # tests/Blaizio.Docs.E2E/ci-shards.ps1 is the one place that says which test class runs in
  # which shard. Its last shard takes every class the others do not name, so a new test class
  # runs in CI without an edit here or there.
  docs-e2e-plan:
    name: Docs E2E plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.shards.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: tests/Blaizio.Docs.E2E

      - name: Read the shard list
        id: shards
        shell: pwsh
        run: |
          $matrix = ./tests/Blaizio.Docs.E2E/ci-shards.ps1 -Matrix
          ./tests/Blaizio.Docs.E2E/ci-shards.ps1
          "matrix=$matrix" >> $env:GITHUB_OUTPUT

  # Tests stay one at a time inside a shard: several are timing-sensitive, and a runner busy
  # with a second browser brings those races back. The speed comes from the extra runners.
  docs-e2e-shard:
    name: Docs E2E shard (${{ matrix.shard }})
    needs: docs-e2e-plan
    runs-on: ubuntu-latest
    strategy:
      # A red shard does not cancel the others: one run reports every failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.docs-e2e-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            src/Blaizio.Base/lib/pnpm-lock.yaml
            docs/Blaizio.Docs/lib/pnpm-lock.yaml

      - name: Build Blaizio.Base scripts
        working-directory: src/Blaizio.Base/lib
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install docs toolchain
        working-directory: docs/Blaizio.Docs/lib
        run: pnpm install --frozen-lockfile

      # Building up front keeps the fixture's `dotnet run` boot incremental and comfortably
      # inside its readiness window.
      - name: Build docs app and E2E project
        run: |
          dotnet build docs/Blaizio.Docs
          dotnet build tests/Blaizio.Docs.E2E

      # Deterministic browser provisioning; the fixture's own install call becomes a no-op.
      - name: Install Playwright Chromium
        run: pwsh tests/Blaizio.Docs.E2E/bin/Debug/net10.0/playwright.ps1 install --with-deps chromium

      - name: Run functional and axe tests
        env:
          BLAIZIO_E2E: "1"
          E2E_FILTER: ${{ matrix.filter }}
        run: dotnet test tests/Blaizio.Docs.E2E --no-build --filter "$E2E_FILTER"

      # Every axe violation of every impact, pass or fail - moderate/minor findings are recorded
      # evidence even when the serious/critical gate stays green. One artifact per shard (a
      # name can be uploaded once per run); a shard that ran no axe test uploads nothing.
      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: axe-results-${{ matrix.shard }}
          path: tests/Blaizio.Docs.E2E/AxeResults/
          if-no-files-found: ignore

  # Keeps the name the suite has always reported under, so a required status check on it holds.
  # always(): a skipped job counts as passing for a required check, and this one must fail when
  # a shard failed, was cancelled, or never started.
  docs-e2e:
    name: Docs E2E (functional + axe)
    needs: [docs-e2e-plan, docs-e2e-shard]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        env:
          PLAN_RESULT: ${{ needs.docs-e2e-plan.result }}
          SHARDS_RESULT: ${{ needs.docs-e2e-shard.result }}
        run: |
          echo "plan: $PLAN_RESULT, shards: $SHARDS_RESULT"
          test "$PLAN_RESULT" = success && test "$SHARDS_RESULT" = success

  registry:
    name: Registry manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      # The committed manifest must match what a fresh scan produces - a component added
      # without regenerating registry.json would otherwise ship stale.
      - name: Manifest is up to date
        run: |
          dotnet run --project src/Blaizio.Cli -- generate ./src/Blaizio.Ui --fonts
          git diff --exit-code -- src/Blaizio.Ui/registry.json

      - name: Manifest validates
        run: dotnet run --project src/Blaizio.Cli -- registry validate src/Blaizio.Ui/registry.json
