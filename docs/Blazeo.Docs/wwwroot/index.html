<!DOCTYPE html>
<html lang="en" class="style-ember">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blazeo</title>
    <base href="/" />
    <link rel="stylesheet" href="app#[.{fingerprint}].css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
        // Apply the persisted theme + style before first paint (no flash). Everything else goes
        // through the IDocsJs service + js/docs.js module - this bootstrap is the one inline
        // exception, because services only come up after Blazor boots, far too late.
        (() => {
            let t = 'light', s = 'ember', d = 'ltr';
            try {
                t = localStorage.getItem('blazeo-theme') || 'light';
                s = localStorage.getItem('blazeo-style') || 'ember';
                d = localStorage.getItem('blazeo-dir') || 'ltr';
            } catch { }
            const el = document.documentElement;
            el.classList.toggle('dark', t === 'dark');
            if (t !== 'light' && t !== 'dark') el.setAttribute('data-theme', t);
            el.classList.remove('style-ember');
            el.classList.add('style-' + s);
            el.dir = d === 'rtl' ? 'rtl' : 'ltr';
        })();
    </script>
</head>

<body class="bg-background text-foreground antialiased">
    <div id="app">
        <div class="flex min-h-screen items-center justify-center text-sm text-muted-foreground">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload underline">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Activity scrollbars: reveal the scrollbar on any [data-scroll-activity] element only while
        // it is actually being scrolled, then fade it out ~900ms after the scrolling stops. Uses a
        // capturing listener so it also covers elements Blazor mounts later (the scroll event itself
        // doesn't bubble). The `.is-scrolling` class is styled by the `scrollbar-activity` utility.
        (() => {
            const timers = new WeakMap();
            document.addEventListener('scroll', (e) => {
                const el = e.target;
                if (!el || el.nodeType !== 1 || !el.matches || !el.matches('[data-scroll-activity]')) return;
                el.classList.add('is-scrolling');
                clearTimeout(timers.get(el));
                timers.set(el, setTimeout(() => el.classList.remove('is-scrolling'), 900));
            }, true);
        })();

        // Sliding active-page indicator for the sidebar nav. Each [data-nav-list] holds one
        // [data-nav-indicator]; we move it to the active row (a[aria-current=page]) so it animates
        // from the old row to the new one via its CSS transition. NavMenu calls position() after each
        // render (i.e. after every navigation / tab switch); a ResizeObserver keeps it aligned on
        // layout changes.
        window.blazeoNav = (() => {
            function place(list) {
                const ind = list.querySelector('[data-nav-indicator]');
                if (!ind) return;
                const active = list.querySelector('a[aria-current="page"]');
                if (!active) { ind.dataset.show = 'false'; return; }
                const lr = list.getBoundingClientRect(), ar = active.getBoundingClientRect();
                ind.style.setProperty('--nav-ind-y', (ar.top - lr.top) + 'px');
                ind.style.setProperty('--nav-ind-h', ar.height + 'px');
                ind.dataset.show = 'true';
            }
            let ro;
            function position() {
                const lists = document.querySelectorAll('[data-nav-list]');
                if (!ro) { ro = new ResizeObserver(() => lists.forEach(place)); }
                lists.forEach(l => { place(l); try { ro.observe(l); } catch { } });
            }
            return { position };
        })();
    </script>
</body>

</html>
