<!DOCTYPE html>
<html lang="en" class="style-ember">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blaizio بليزيو</title>
    <base href="/" />
    <link rel="stylesheet" href="app#[.{fingerprint}].css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
        // Apply the persisted theme + style before first paint (no flash). Everything else goes
        // through the IDocsJs service + js/docs.js module - this bootstrap is the one inline
        // exception, because services only come up after Blazor boots, far too late.
        (() => {
            let t = 'light', s = 'ember', d = 'ltr';
            try {
                t = localStorage.getItem('blaizio-theme') || 'light';
                s = localStorage.getItem('blaizio-style') || 'ember';
                d = localStorage.getItem('blaizio-dir') || 'ltr';
            } catch { }
            const el = document.documentElement;
            el.classList.toggle('dark', t === 'dark');
            if (t !== 'light' && t !== 'dark') el.setAttribute('data-theme', t);
            el.classList.remove('style-ember');
            el.classList.add('style-' + s);
            el.dir = d === 'rtl' ? 'rtl' : 'ltr';
        })();
    </script>
</head>

<body class="bg-background text-foreground antialiased">
    <div id="app">
        <div class="flex min-h-screen items-center justify-center text-sm text-muted-foreground">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload underline">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
    <script>
        // Activity scrollbars + edge fades: on any [data-scroll-activity] element, reveal the
        // scrollbar only WHILE it is being scrolled (fading out ~900ms after), and record whether the
        // content is currently at the top / bottom so the `scroll-fade-y` mask only fades an edge that
        // actually has content beyond it (so the first row stays crisp when scrolled to the top). Uses
        // a capturing listener so it also covers elements Blazor mounts later (scroll doesn't bubble).
        window.blaizioScrollFade = (() => {
            // Mark which edges are scrolled-away (1px slack absorbs sub-pixel rounding).
            function fade(el) {
                el.dataset.atTop = String(el.scrollTop <= 1);
                el.dataset.atBottom = String(el.scrollTop + el.clientHeight >= el.scrollHeight - 1);
            }
            // Re-measure every activity element (called by Blazor after the nav list (re)renders).
            function refresh() { document.querySelectorAll('[data-scroll-activity]').forEach(fade); }
            const timers = new WeakMap();
            document.addEventListener('scroll', (e) => {
                const el = e.target;
                if (!el || el.nodeType !== 1 || !el.matches || !el.matches('[data-scroll-activity]')) return;
                el.classList.add('is-scrolling');
                fade(el);
                clearTimeout(timers.get(el));
                timers.set(el, setTimeout(() => el.classList.remove('is-scrolling'), 900));
            }, true);
            return { refresh };
        })();

        // Sliding active-page indicator for the sidebar nav. Each [data-nav-list] holds one
        // [data-nav-indicator]; we move it to the active row (a[aria-current=page]) so it animates
        // from the old row to the new one via its CSS transition. NavMenu calls position() after each
        // render (i.e. after every navigation / tab switch); a ResizeObserver keeps it aligned on
        // layout changes.
        window.blaizioNav = (() => {
            function place(list) {
                const ind = list.querySelector('[data-nav-indicator]');
                if (!ind) return;
                const active = list.querySelector('a[aria-current="page"]');
                if (!active) { ind.dataset.show = 'false'; return; }
                const lr = list.getBoundingClientRect(), ar = active.getBoundingClientRect();
                ind.style.setProperty('--nav-ind-y', (ar.top - lr.top) + 'px');
                ind.style.setProperty('--nav-ind-h', ar.height + 'px');
                ind.dataset.show = 'true';
            }
            let ro;
            function position() {
                const lists = document.querySelectorAll('[data-nav-list]');
                if (!ro) { ro = new ResizeObserver(() => lists.forEach(place)); }
                lists.forEach(l => { place(l); try { ro.observe(l); } catch { } });
            }
            // Scroll the active row into view inside the sidebar's own scroller - used once on load,
            // so a deep link (/components/tooltip) opens with its nav row visible.
            function reveal() {
                const active = document.querySelector('[data-scroll-activity] a[aria-current="page"]');
                if (!active) return;
                const scroller = active.closest('[data-scroll-activity]');
                if (!scroller) return;
                const sr = scroller.getBoundingClientRect(), ar = active.getBoundingClientRect();
                if (ar.top < sr.top || ar.bottom > sr.bottom) {
                    scroller.scrollTop += ar.top - sr.top - (sr.height - ar.height) / 2;
                }
            }
            return { position, reveal };
        })();
    </script>
</body>

</html>
