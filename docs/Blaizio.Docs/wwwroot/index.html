<!DOCTYPE html>
<html lang="en" class="style-ember">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Blaizio</title>
    <base href="/" />
    <link rel="stylesheet" href="app#[.{fingerprint}].css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Re-applies the persisted theme/style/direction before first paint (no flash). Everything
         else goes through the IDocsJs service + js/docs.js module; this classic script from
         Blaizio.Base is the one pre-Blazor exception, because services only come up after Blazor
         boots, far too late. -->
    <script src="_content/blaizio.base/dist/boot.js"></script>
</head>

<body class="bg-background text-foreground antialiased">
    <div id="app">
        <div class="flex min-h-screen items-center justify-center text-sm text-muted-foreground">Loading…</div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload underline">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
